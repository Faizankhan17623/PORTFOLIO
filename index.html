    <!-- Boot screen: shown instantly while the JavaScript downloads, then replaced by the real loader. -->
    <style>
      html { background: #f5f4ed; }
      .boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 42%, #e9f3c9 0%, #f5f4ed 62%); font-family: 'Space Grotesk', system-ui, sans-serif; color: #18382b; }
      .boot-inner { display: grid; justify-items: center; gap: 18px; }
      .boot-face { position: relative; width: 150px; height: 118px; animation: boot-float 3s ease-in-out infinite; }
      .boot-face::before { content: ''; position: absolute; inset: 14px 0 0; border-radius: 38px; background: #fbfaf4; box-shadow: 0 18px 38px rgba(24, 56, 43, 0.16); }
      .boot-screen { position: absolute; left: 19px; right: 19px; top: 30px; height: 70px; display: flex; justify-content: center; align-items: center; gap: 24px; border-radius: 22px; background: #0a1511; }
      .boot-eye { width: 20px; height: 26px; border-radius: 7px; background: #d4f27f; box-shadow: 0 0 14px rgba(212, 242, 127, 0.7); }
      .boot-smile { position: absolute; bottom: 12px; left: 50%; width: 26px; height: 13px; border: 3px solid #d4f27f; border-top: 0; border-radius: 0 0 26px 26px; transform: translateX(-50%); }
      .boot-ear { position: absolute; top: 46px; width: 12px; height: 38px; border-radius: 8px; background: #e97558; }
      .boot-ear.left { left: -8px; }
      .boot-ear.right { right: -8px; }
      .boot-antenna { position: absolute; left: 50%; top: 0; width: 3px; height: 18px; background: #22302a; transform: translateX(-50%); }
      .boot-antenna::before { content: ''; position: absolute; left: 50%; top: -9px; width: 14px; height: 14px; border-radius: 50%; background: #d4f27f; box-shadow: 0 0 0 4px rgba(212, 242, 127, 0.35); transform: translateX(-50%); }
      .boot-name { margin: 0; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; }
      .boot-track { position: relative; width: 240px; height: 5px; overflow: hidden; border-radius: 999px; background: rgba(24, 56, 43, 0.12); }
      .boot-track::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 999px; background: linear-gradient(90deg, #6b9c56, #d4f27f); animation: boot-slide 1.2s ease-in-out infinite; }
      @keyframes boot-float { 50% { transform: translateY(-7px); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-face, .boot-track::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot" aria-hidden="true">
        <div class="boot-inner">
          <div class="boot-face">
            <span class="boot-antenna"></span><span class="boot-ear left"></span><span class="boot-ear right"></span>
            <div class="boot-screen"><span class="boot-eye"></span><span class="boot-eye"></span><span class="boot-smile"></span></div>
          </div>
          <p class="boot-name">Faizan Khan</p>
          <div class="boot-track"></div>
        </div>
      </div>
    </div>
    <!-- Returning visitors in the same tab skip the opening loader, so they skip the boot screen too. -->
    <script>try { if (sessionStorage.getItem('portfolio_intro_seen') === '1') document.getElementById('boot').style.display = 'none' } catch (e) {}</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
